name: Build and Push Custom Base Image

on:
  push:
    paths:
      - 'base-image/**'
      - '.github/workflows/build-base.yml'
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'Also publish a version tag (v1, v2, ...)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/_build-container-dev.yml
    with:
      image_name: base
      context: ./base-image
      dockerfile: ./base-image/Dockerfile.base
    secrets: inherit
