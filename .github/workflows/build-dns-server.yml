name: Build and Push DNS Server Image

on:
  push:
    paths:
      - 'dns-server/**'
      - '.github/workflows/build-dns-server.yml'
  workflow_dispatch:
    inputs:
      dev_mode:
        description: 'Build as dev image only (dev tag) even on the main branch'
        required: false
        default: false
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/_build-container-dev.yml
    with:
      image_name: dns-server
      context: ./dns-server
      dockerfile: ./dns-server/Dockerfile
      dev_mode: ${{ inputs.dev_mode || false }}
    secrets: inherit
