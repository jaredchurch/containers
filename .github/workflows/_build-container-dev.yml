name: Build and Push Container Dev Image

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name under the owner namespace (e.g. base, airflow)'
        required: true
        type: string
      context:
        description: 'Build context directory (e.g. ./base-image)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile (e.g. .dev/base-image/Dockerfile.base)'
        required: true
        type: string
      dev_mode:
        description: 'Run in dev mode (dev tag only) even on the main branch'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Print Dockerfile to log
        run: cat ${{ inputs.dockerfile }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        env:
          IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.image_name }}
        run: |
          BASE="${{ env.REGISTRY }}/${IMAGE_NAME}"
          ON_MAIN="${{ github.ref == 'refs/heads/main' }}"
          DEV_ONLY="${{ inputs.dev_mode == true }}"
          TAGS=""
          echo "version_tag=" >> "$GITHUB_OUTPUT"

          SCOPE="repository:${IMAGE_NAME}:pull"
          AUTH_TOKEN=$(curl -s "https://${{ env.REGISTRY }}/token?service=${{ env.REGISTRY }}&scope=$SCOPE" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r '.token')
          echo "Auth token obtained: ${AUTH_TOKEN:0:20}..."

          RESPONSE=$(curl -s -H "Authorization: Bearer $AUTH_TOKEN" \
            "https://${{ env.REGISTRY }}/v2/${IMAGE_NAME}/tags/list")
          echo "Raw API response: $RESPONSE"

          MAX=$(echo "$RESPONSE" | jq -r '.tags // [] | map(select(test("^v\\d+$"))) | map(.[1:] | tonumber) | max // 0')
          echo "Parsed max version number: $MAX"
          NEW_TAG="v$((MAX + 1))"
          echo "New Tag: $NEW_TAG"

          if [[ "$ON_MAIN" == "true" && "$DEV_ONLY" != "true" ]]; then
            TAGS="$BASE:latest,$BASE:$NEW_TAG"
            echo "version_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "Prod build on main: latest + $NEW_TAG (no dev tag)"
          else
            TAGS="$BASE:dev"
            echo "Dev build (branch: ${{ github.ref }}, dev_mode: $DEV_ONLY): dev tag only"
          fi
          echo "Tags to push: $TAGS"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## 🐳 GHCR Tags" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.tags.outputs.version_tag }}" ]; then
            echo "**Prod build:** \`latest\` + \`${{ steps.tags.outputs.version_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Dev build:** \`dev\` tag only" >> "$GITHUB_STEP_SUMMARY"
          fi
