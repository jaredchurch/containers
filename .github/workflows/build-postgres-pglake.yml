name: Build and Push Postgres-pglake Image

on:
  push:
    paths:
      - 'postgres-pglake/**'
      - '.github/workflows/build-postgres-pglake.yml'
  workflow_dispatch:
    inputs:
      dev_mode:
        description: 'Build as dev image only (dev tag) even on the main branch'
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-container-dev.yml
    with:
      image_name: postgres-pglake
      context: ./postgres-pglake
      dockerfile: ./postgres-pglake/Dockerfile.postgres-pglake
      dev_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_mode }}
    secrets: inherit
